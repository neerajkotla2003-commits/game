server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;

    location = /health {
        default_type text/plain;
        return 200 'healthy\n';
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
